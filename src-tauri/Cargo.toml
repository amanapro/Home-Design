[package]
name = "benchmark-planner"
version = "0.3.0"
description = "Floor plans, elevations, 3D and takeoff"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "benchmark_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Exit the app after the "save before exit?" question (Android back button, window close)
tauri-plugin-process = "2"
# Bluetooth Low Energy, for reading lengths from a Bosch laser measure (GLM 400 C / GLM 50 C / GLM 100 C)
tauri-plugin-blec = "0.17"

# Desktop only: remembers the window's size and position (and maximized state) between runs
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Local copy of the Bluetooth plugin with one fix: subscribe uses indications when a characteristic offers them
# (Bosch laser measures reject plain notifications). See vendor/tauri-plugin-blec/android/.../Peripheral.kt.
[patch.crates-io]
tauri-plugin-blec = { path = "vendor/tauri-plugin-blec" }
