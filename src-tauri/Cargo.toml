[package]
name = "benchmark-planner"
version = "0.3.0"
description = "Floor plans, elevations, 3D and takeoff"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "benchmark_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Bluetooth Low Energy, for reading lengths from a Bosch laser measure (GLM 400 C / GLM 50 C / GLM 100 C)
tauri-plugin-blec = "0.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
